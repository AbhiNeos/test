<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="#fff"/>
  <!-- Top bar -->
  <rect width="1200" height="40" fill="#1a1a2e"/>
  <!-- Nav -->
  <rect y="40" width="1200" height="70" fill="#fff"/>
  <text x="40" y="82" font-family="Georgia, serif" font-size="22" fill="#1a1a2e" font-weight="bold">Fashion Shop</text>
  <text x="40" y="100" font-family="Arial" font-size="9" fill="#d4a574" letter-spacing="2">WOMEN'S KURTIS</text>
  <!-- Hero -->
  <rect y="110" width="1200" height="350" fill="url(#hero-bg)"/>
  <circle cx="900" cy="250" r="200" fill="rgba(212,165,116,0.08)"/>
  <text x="600" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="42" fill="#fff" font-weight="bold">Discover Beautiful Kurtis</text>
  <text x="600" y="300" text-anchor="middle" font-family="Arial" font-size="16" fill="rgba(255,255,255,0.8)">Explore our exclusive collection of women's kurtis</text>
  <rect x="525" y="330" width="150" height="45" rx="22" fill="#d4a574"/>
  <text x="600" y="358" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff" font-weight="bold">Shop Now</text>
  <!-- Products section -->
  <text x="600" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#1a1a2e">Featured Collection</text>
  <rect x="42" y="10" width="3" height="3" fill="#d4a574" transform="translate(575, 520)"/>
  <!-- Product cards -->
  <rect x="80" y="550" width="240" height="300" rx="12" fill="#f8f6f4" stroke="#f0ece8"/>
  <rect x="360" y="550" width="240" height="300" rx="12" fill="#f8f6f4" stroke="#f0ece8"/>
  <rect x="640" y="550" width="240" height="300" rx="12" fill="#f8f6f4" stroke="#f0ece8"/>
  <rect x="920" y="550" width="240" height="300" rx="12" fill="#f8f6f4" stroke="#f0ece8"/>
</svg>
