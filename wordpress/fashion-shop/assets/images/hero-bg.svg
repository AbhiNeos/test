<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d2b1f"/>
      <stop offset="50%" style="stop-color:#4a3728"/>
      <stop offset="100%" style="stop-color:#5c4033"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#a67c52; stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="70%" r="35%">
      <stop offset="0%" style="stop-color:#a67c52; stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
    <pattern id="fabric" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M0 30 Q15 25 30 30 Q45 35 60 30" fill="none" stroke="rgba(166,124,82,0.06)" stroke-width="1"/>
      <path d="M0 50 Q15 45 30 50 Q45 55 60 50" fill="none" stroke="rgba(166,124,82,0.04)" stroke-width="1"/>
      <path d="M0 10 Q15 5 30 10 Q45 15 60 10" fill="none" stroke="rgba(166,124,82,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1400" height="600" fill="url(#heroBg)"/>
  <rect width="1400" height="600" fill="url(#fabric)"/>
  <rect width="1400" height="600" fill="url(#glow1)"/>
  <rect width="1400" height="600" fill="url(#glow2)"/>
  <!-- Decorative elements -->
  <circle cx="1100" cy="150" r="180" fill="none" stroke="rgba(166,124,82,0.08)" stroke-width="1"/>
  <circle cx="1100" cy="150" r="140" fill="none" stroke="rgba(166,124,82,0.06)" stroke-width="1"/>
  <circle cx="1100" cy="150" r="100" fill="none" stroke="rgba(166,124,82,0.04)" stroke-width="1"/>
  <circle cx="200" cy="450" r="150" fill="none" stroke="rgba(166,124,82,0.06)" stroke-width="1"/>
  <circle cx="200" cy="450" r="110" fill="none" stroke="rgba(166,124,82,0.04)" stroke-width="1"/>
  <!-- Paisley decorations -->
  <g opacity="0.06" fill="none" stroke="#a67c52" stroke-width="1.5">
    <path d="M1200 400 Q1230 370 1220 340 Q1210 310 1180 320 Q1150 330 1160 360 Q1170 390 1200 400 Z"/>
    <path d="M100 100 Q130 70 120 40 Q110 10 80 20 Q50 30 60 60 Q70 90 100 100 Z"/>
    <path d="M700 520 Q720 500 715 480 Q710 460 695 465 Q680 470 685 490 Q690 510 700 520 Z"/>
  </g>
  <!-- Floating dots -->
  <g fill="#a67c52" opacity="0.1">
    <circle cx="300" cy="100" r="3"/><circle cx="500" cy="200" r="2"/><circle cx="900" cy="350" r="3"/>
    <circle cx="1200" cy="500" r="2"/><circle cx="150" cy="300" r="2"/><circle cx="700" cy="100" r="2.5"/>
    <circle cx="1050" cy="450" r="2"/><circle cx="400" cy="400" r="2.5"/><circle cx="600" cy="500" r="2"/>
  </g>
  <!-- Mannequin silhouettes -->
  <g opacity="0.04" fill="#a67c52">
    <!-- Right mannequin -->
    <ellipse cx="1150" cy="230" rx="20" ry="25"/>
    <path d="M1130 255 Q1150 250 1170 255 L1180 350 Q1180 450 1170 500 L1130 500 Q1120 450 1120 350 Z"/>
    <!-- Left mannequin -->
    <ellipse cx="250" cy="200" rx="18" ry="22"/>
    <path d="M232 222 Q250 218 268 222 L275 310 Q275 400 268 450 L232 450 Q225 400 225 310 Z"/>
  </g>
</svg>
